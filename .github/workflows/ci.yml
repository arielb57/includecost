name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # Pinned: `-D warnings` on a floating stable turns a clippy release
      # into a build break with no change here. Bump deliberately.
      - uses: dtolnay/rust-toolchain@1.94.1
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test --all-targets
      - name: Demo
        run: cargo run --release -- analyze examples/demo/compile_commands.json
      - name: Benchmark (quick)
        run: cargo run --release --example benchmark -- --quick

  # Tests also run against current stable, so real breakage still surfaces
  # even though the lint job is pinned.
  test-stable:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-targets

  # The MSRV in Cargo.toml is a promise, so it gets tested rather than asserted.
  msrv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.74.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-targets
